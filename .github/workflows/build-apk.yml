
name: Build MBoard Keyboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME is not set"
            exit 1
          fi

          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found in Android SDK."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q MBoard-Keyboard-Android-Project.zip -d extracted

          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR="$(dirname "$GRADLEW")"
            chmod +x "$GRADLEW"
            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"
          else
            SETTINGS=$(find extracted -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: Gradle settings file not found."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS")"
            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" \
            >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Set up Gradle
        if: env.USE_WRAPPER == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ "$USE_WRAPPER" = "true" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MBoard-Keyboard-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
