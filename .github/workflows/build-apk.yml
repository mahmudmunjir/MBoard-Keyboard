
name: Build MBoard Keyboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: ANDROID_HOME is not set"
            exit 1
          fi

          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null | head -n 1)
          fi

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q MBoard-Keyboard-Android-Project.zip -d extracted

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            ! -path '*/buildSrc/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" \
            >> "$GITHUB_ENV"

          GRADLEW=$(find "$PROJECT_DIR" -maxdepth 1 \
            -type f -name gradlew | head -n 1)

          if [ -n "$GRADLEW" ]; then
            chmod +x "$GRADLEW"
            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"
          else
            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"
          fi

          echo "Project directory: $PROJECT_DIR"

      - name: Add Material Components dependency
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          FILE="app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi

          if ! grep -q 'com.google.android.material:material' "$FILE"; then
            FILE="$FILE" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["FILE"])
          text = path.read_text()

          dependency = '    implementation("com.google.android.material:material:1.12.0")'

          if "dependencies {" not in text:
              raise SystemExit("ERROR: dependencies block not found")

          text = text.replace(
              "dependencies {",
              "dependencies {\n" + dependency,
              1
          )

          path.write_text(text)
          print("Material Components dependency added.")
          PY
          else
            echo "Material Components dependency already exists."
          fi

      - name: Set up Gradle
        if: env.USE_WRAPPER == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure Gradle memory
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          FILE="gradle.properties"
          touch "$FILE"

          # Replace these settings if they already exist, avoiding duplicate keys.
          sed -i '/^[[:space:]]*org\.gradle\.jvmargs[[:space:]]*=/d' "$FILE"
          sed -i '/^[[:space:]]*kotlin\.daemon\.jvmargs[[:space:]]*=/d' "$FILE"
          sed -i '/^[[:space:]]*org\.gradle\.workers\.max[[:space:]]*=/d' "$FILE"
          sed -i '/^[[:space:]]*org\.gradle\.parallel[[:space:]]*=/d' "$FILE"

          cat >> "$FILE" <<'PROPERTIES'
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.workers.max=2
org.gradle.parallel=false
PROPERTIES

          echo "Gradle memory settings applied:"
          tail -n 4 "$FILE"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ "$USE_WRAPPER" = "true" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MBoard-Keyboard-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
