
name: Build MBoard Keyboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q MBoard-Keyboard-Android-Project.zip -d extracted

          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR="$(dirname "$GRADLEW")"
            chmod +x "$GRADLEW"
            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"
          else
            GRADLE_FILE=$(find extracted -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              ! -path '*/buildSrc/*' | head -n 1)

            if [ -z "$GRADLE_FILE" ]; then
              echo "ERROR: No Gradle build file found in ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$GRADLE_FILE")"

            while [ "$PROJECT_DIR" != "extracted" ] && \
              [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
              [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; do
              PARENT="$(dirname "$PROJECT_DIR")"
              if [ "$PARENT" = "." ] || [ "$PARENT" = "$PROJECT_DIR" ]; then
                break
              fi
              PROJECT_DIR="$PARENT"
            done

            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" \
            >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Gradle
        if: env.USE_WRAPPER == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ "$USE_WRAPPER" = "true" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MBoard-Keyboard-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
